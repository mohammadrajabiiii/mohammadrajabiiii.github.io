  <script>
    // when a "mail-copy" link is clicked, copy its email instead of opening a mail app
    document.querySelectorAll('.mail-copy').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();                                  // don't follow the "#" link
        navigator.clipboard.writeText(this.dataset.email);   // copy the address
        var label = this.querySelector('i');
        var original = label.textContent;
        label.textContent = 'Copied!';                       // quick feedback
        setTimeout(function () { label.textContent = original; }, 1500);
      });
    });
  </script>
